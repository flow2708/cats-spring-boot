<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Профиль</title>
  <style>
    body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
    .info { background: #f0f0f0; padding: 20px; border-radius: 5px; }
    button { background: #dc3545; color: white; padding: 10px 20px; border: none; }
  </style>
</head>
<body>
<div class="info">
  <h2>Профиль пользователя</h2>
  <p>Добро пожаловать, <strong th:text="${username}">User</strong>!</p>
  <a href="/logout">
    <button>Выйти</button>
  </a>
</div>
<p><a href="/main">На главную</a></p>
</body>
</html>
