<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Главная | DarkTheme</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0c0f;
            color: #e1e4e8;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 90%;
            margin: 2rem auto;
            padding: 2rem;
            background: #1a1d24;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #2d333b;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #fff;
            letter-spacing: -0.02em;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: #9da5b4;
            letter-spacing: -0.01em;
        }

        .welcome-section {
            background: #252a33;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid #363e48;
        }

        .welcome-text {
            font-size: 1.1rem;
            color: #b9c1cf;
        }

        .username {
            color: #58a6ff;
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: #238636;
            color: white;
        }

        .btn-primary:hover {
            background: #2ea043;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #2d333b;
            color: #e1e4e8;
            border-color: #444c56;
        }

        .btn-secondary:hover {
            background: #363e48;
            transform: translateY(-1px);
        }

        .btn-logout {
            background: #da3633;
            color: white;
        }

        .btn-logout:hover {
            background: #e05a57;
            transform: translateY(-1px);
        }

        .features {
            display: grid;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #2d333b;
        }

        .feature-item {
            padding: 0.75rem;
            background: #1e2329;
            border-radius: 8px;
            color: #8b949e;
            font-size: 0.95rem;
        }

        .feature-item::before {
            content: "→";
            color: #58a6ff;
            margin-right: 0.5rem;
        }

        @media (max-width: 480px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 1.5rem; }
            .nav-links { flex-direction: column; }
            .btn { text-align: center; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚡ DarkTheme</h1>

    <div class="welcome-section" th:if="${username}">
        <div class="welcome-text">
            Добро пожаловать, <span class="username" th:text="${username}">User</span>!
        </div>
        <div class="nav-links">
            <a href="/profile" class="btn btn-primary">👤 Профиль</a>
            <a href="/logout" class="btn btn-logout">🚪 Выйти</a>
        </div>
    </div>

    <div class="welcome-section" th:unless="${username}">
        <h2>👋 Добро пожаловать</h2>
        <div class="nav-links">
            <a href="/login-page" class="btn btn-primary">🔑 Войти</a>
            <a href="/" class="btn btn-secondary">📝 Регистрация</a>
        </div>
    </div>

    <div class="features">
        <div class="feature-item">Минималистичный темный интерфейс</div>
        <div class="feature-item">Spring Boot + JPA + H2</div>
        <div class="feature-item">Thymeleaf шаблоны</div>
    </div>
</div>
</body>
</html>
